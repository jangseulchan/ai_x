<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        window.onload = function() {
            const btnImg = document.querySelector("img");
            btnImg.addEventListener("mousedown", function () {
                btnImg.src = "img/but2.gif";
            });
            btnImg.addEventListener("mouseup", function () {
                btnImg.src = "img/but1.gif";
            });
        };
    </script>
</head>
<body>
    <img src="img/but1.gif" alt="mouse up" />
</body>

</html>
