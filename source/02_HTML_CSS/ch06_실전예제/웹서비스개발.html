<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="css/웹서비스개발.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="wrap">
        <nav>
            <div id="nav_left">
                <ul>
                    <li>LOGO</li>
                    <li>참여하기</li>
                    <li>개설하기</li>
                    <li>검색하기</li>
                </ul>
            </div>
            <div id="nav_right">
                <ul>
                    <li>고객센터</li>
                    <li>로그아웃</li>
                    <li>홍길동님</li>
                </ul>
            </div>
        </nav>
        <div id="content">
            <div id="title">
                마이페이지
            </div>
            <div id="lnb">
                <ul>
                    <li>나의여행</li>
                    <li>참여여행</li>
                    <li>관심여행</li>
                    <li>개인정보변경</li>
                    <li>비밀번호변경</li>
                </ul>
            </div>
            <div id="my_content">
                <div id="sub_title">개인정보변경</div>
                <div id="modify">
                    <form>
                        <table>
                            <tr>
                                <td>이름</td>
                                <td><input type="text" name="name" /></td>
                            </tr>
                            <tr>
                                <td>아이디</td>
                                <td><input type="text" name="id" /></td>
                            </tr>
                            <tr>
                                <td>이메일</td>
                                <td><input type="email" name="email" /></td>
                            </tr>
                            <tr>
                                <td>전화</td>
                                <td><input type="text" name="tel" /></td>
                            </tr>
                            <tr>
                                <td>생년월일</td>
                                <td><input type="text" name="birth" /></td>
                            </tr>
                            <tr>
                                <td>주소</td>
                                <td><input type="text" name="address" /></td>
                            </tr>
                            <tr>
                                <th colspan="2">
                                    <input type="submit" value="저장" />
                                </th>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </div>
        <footer>
            footer
        </footer>
    </div>
